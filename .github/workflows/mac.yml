name: macOS 15

on:
  push:
    branches:
      - main
      - master
      - coro_http_server
  pull_request:
    branches:
      - main
      - master
      - coro_http_server

jobs:
  build_on_mac:
    strategy:
      matrix:
        mode: [Debug, Release]
        ssl: [ON, OFF]

    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: SetUp HomeBrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
      
      - name: Install Dependencies
        run: HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install openssl@3 protobuf

      - name: Configure CMake
        run: OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" CXX=clang++ CC=clang cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.mode}} -DCINATRA_ENABLE_SSL=${{matrix.ssl}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.mode}} --parallel 2

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{matrix.mode}} -j 2 -V

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with: 
          name: LastTest.log
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
