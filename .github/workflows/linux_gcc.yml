name: Ubuntu 22.04 (gcc)

on:
  push:
    branches:
      - main
      - master
      - coro_http_server
  pull_request:
    branches:
      - main
      - master
      - coro_http_server

jobs:
  build_by_gcc:
    strategy:
      matrix:
        mode: [Debug, Release]
        ssl: [ON, OFF]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get install openssl
          sudo apt-get install libssl-dev

      - name: Configure CMake
        run: CXX=g++ CC=gcc cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.mode}} -DCINATRA_ENABLE_SSL=${{matrix.ssl}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.mode}} --parallel 2

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{matrix.mode}} -j 2 -V

      - name: Report CTest Failure
        if: failure()
        working-directory: ${{github.workspace}}/build
        run: |
          if [ -f Testing/Temporary/LastTest.log ]; then
            python3 - <<'PY'
          from pathlib import Path

          log = Path("Testing/Temporary/LastTest.log")
          snippet = log.read_text(errors="replace")[-3500:]
          escaped = (
              snippet.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          )
          print(f"::error title=CTest LastTest.log::{escaped}")
          PY
          fi

      - name: Upload CTest Artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gcc-${{ matrix.mode }}-ssl-${{ matrix.ssl }}-LastTest.log
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log

  ubuntu_gcc_for_liburing:
    strategy:
      matrix:
        mode: [Release, Debug]
        io_uring: [ ON ]
        case_name: [ test_corofile ]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install liburing
        run: |      
          wget https://github.com/axboe/liburing/archive/refs/tags/liburing-2.3.tar.gz
          tar -zxvf liburing-2.3.tar.gz
          cd liburing-liburing-2.3/
          ./configure --cc=gcc --cxx=g++
          make
          sudo make install

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.mode}}-ssl( ${{ matrix.ssl}} )

      - name: Configure
        run: |
          CXX=g++ CC=gcc 
          cmake -B ${{github.workspace}}/build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{matrix.mode}} \
                -DENABLE_FILE_IO_URING=${{matrix.io_uring}} \
                -DUSE_CCACHE=${{env.ccache}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.mode}} --target ${{matrix.case_name}} --parallel 2

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{matrix.mode}} -R ${{matrix.case_name}} -j 2 -V
